name: Release Standalone Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: mth5-panel-app-linux-amd64
            dist_name: mth5-panel-app
          - os: windows-latest
            asset_name: mth5-panel-app-windows-amd64.exe
            dist_name: mth5-panel-app.exe
          - os: macos-latest
            asset_name: mth5-panel-app-macos-amd64
            dist_name: mth5-panel-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name mth5-panel-app \
            --exclude-module panel.tests \
            --exclude-module bokeh.sampledata \
            --exclude-module bokeh.sphinxext \
            --exclude-module bokeh._testing \
            --exclude-module holoviews.tests \
            --exclude-module hvplot.tests \
            --exclude-module datashader.tests \
            --exclude-module colorcet.tests \
            --exclude-module mth5.tests \
            --exclude-module mt_metadata.tests \
            --exclude-module obspy.signal.tests \
            --exclude-module obspy.imaging.tests \
            --exclude-module obspy.io.nordic.tests \
            --exclude-module matplotlib.tests \
            --exclude-module PIL.tests \
            --collect-all mth5_panel \
            --collect-all panel \
            --collect-all bokeh \
            --collect-all holoviews \
            --collect-all hvplot \
            --collect-all datashader \
            --collect-all colorcet \
            --collect-all mth5 \
            --collect-all mt_metadata \
            --collect-all obspy \
            --exclude-module panel.tests \
            --exclude-module holoviews.tests \
            --exclude-module hvplot.tests \
            --exclude-module datashader.tests \
            --exclude-module datashader.tests.benchmarks \
            --exclude-module bokeh.sampledata \
            --exclude-module bokeh.sphinxext \
            --exclude-module matplotlib.tests \
            --exclude-module scipy.tests \
            --exclude-module numpy.tests \
            mth5_panel/serve_mth5_panel_app.py

      - name: Smoke test executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.dist_name }}
          ./dist/${{ matrix.dist_name }} --help

      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\${{ matrix.dist_name }} --help

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "dist/${{ matrix.dist_name }}" -Destination "dist/${{ matrix.asset_name }}"
          Compress-Archive -Path "dist/${{ matrix.asset_name }}" -DestinationPath "dist/${{ matrix.asset_name }}.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset_name }}.zip").Hash
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -FilePath "dist/${{ matrix.asset_name }}.zip.sha256" -Encoding ASCII

      - name: Package Linux/macOS executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "dist/${{ matrix.dist_name }}" "dist/${{ matrix.asset_name }}"
          shasum -a 256 "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256

      - name: Upload Unix bundle
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/mth5-panel-app-linux-amd64/mth5-panel-app-linux-amd64
            artifacts/mth5-panel-app-linux-amd64/mth5-panel-app-linux-amd64.sha256
            artifacts/mth5-panel-app-windows-amd64.exe/mth5-panel-app-windows-amd64.exe.zip
            artifacts/mth5-panel-app-windows-amd64.exe/mth5-panel-app-windows-amd64.exe.zip.sha256
            artifacts/mth5-panel-app-macos-amd64/mth5-panel-app-macos-amd64
            artifacts/mth5-panel-app-macos-amd64/mth5-panel-app-macos-amd64.sha256
