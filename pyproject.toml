[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mth5-panel"
version = "0.0.7"
authors = [
    { name = "MTH5 development team" },
]
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bokeh",
    "colorcet",
    "cytoolz",
    "datashader",
    "holoviews",
    "hvplot",
    "h5py",
    "loguru",
    "numpy",
    "pandas",
    "panel",
    "param",
    "pendulum",
    "polars",
    "psutil",
    "toolz",
    "xarray",
    "mth5",
    "mt_metadata",
    "obspy",
]

[project.optional-dependencies]
all = []
test = [
    "pytest>=8",
]

[project.scripts]
mth5-panel-app = "mth5_panel.serve_mth5_panel_app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mth5_panel = ["assets/*.png"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.bumpversion]
current_version = "0.0.7"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "mth5_panel/__init__.py"

[[tool.bumpversion.files]]
filename = "README.md"
