[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mth5-panel"
version = "0.0.1"
authors = [
    { name = "MTH5 development team" },
]
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bokeh",
    "colorcet",
    "cytoolz",
    "datashader",
    "holoviews",
    "hvplot",
    "h5py",
    "loguru",
    "numpy",
    "pandas",
    "panel",
    "param",
    "pendulum",
    "polars",
    "psutil",
    "toolz",
    "xarray",
    "mth5",
    "mt_metadata",
]

[project.optional-dependencies]
all = []
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mth5_panel = ["assets/*.png"]
